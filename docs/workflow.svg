      <text x="58" y="267">Qwen3.5 9B text encoder</text>
      <text x="58" y="294">FLUX.2 VAE</text>
      <text x="410" y="240">ER SDE · Simple · 25 steps</text>
      <text x="410" y="267">CFG 3 · shift 5 · noise 1.1</text>
