<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title">
  <title id="title">MOSS Base Realism workflow for Forge Neo</title>
  <rect width="1080" height="390" rx="24" fill="#101821"/>
  <g font-family="system-ui, sans-serif">
    <text x="38" y="49" fill="#91e1b5" font-size="14" font-weight="700" letter-spacing="3">PROJECT INVISIBLE</text>
    <text x="38" y="101" fill="#f4faf8" font-size="42" font-weight="700">MOSS Base Realism</text>
    <text x="38" y="135" fill="#b3c3cd" font-size="20">The shared ComfyUI recipe in Forge Neo’s text-to-image workflow</text>
    <g fill="#1b2935" stroke="#354a59">
      <rect x="38" y="169" width="300" height="167" rx="14"/>
      <rect x="390" y="169" width="300" height="167" rx="14"/>
      <rect x="742" y="169" width="300" height="167" rx="14"/>
    </g>
    <g font-size="19" font-weight="700" fill="#91e1b5">
